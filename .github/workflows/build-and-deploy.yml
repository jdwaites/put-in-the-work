name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  SERVICE: ${{ vars.SERVICE_NAME || 'putting-in-the-work' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  MEMORY: ${{ vars.CLOUD_RUN_MEMORY || '512Mi' }}
  CPU: ${{ vars.CLOUD_RUN_CPU || '1' }}
  MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '10' }}
  MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '0' }}
  PORT: ${{ vars.CLOUD_RUN_PORT || '8080' }}
  TIMEOUT: ${{ vars.CLOUD_RUN_TIMEOUT || '300' }}
  NODE_ENV: ${{ vars.NODE_ENV || 'production' }}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Docker Auth
        uses: 'docker/login-action@v3'
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker to use gcloud as a credential helper
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Create Artifact Registry repository if it doesn't exist
        run: |
          gcloud artifacts repositories create ${{ env.SERVICE }} \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --description="Repository for ${{ env.SERVICE }}" || true

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=${{ env.MEMORY }}
            --cpu=${{ env.CPU }}
            --max-instances=${{ env.MAX_INSTANCES }}
            --min-instances=${{ env.MIN_INSTANCES }}
            --port=${{ env.PORT }}
            --timeout=${{ env.TIMEOUT }}
            --set-env-vars=NODE_ENV=${{ env.NODE_ENV }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
