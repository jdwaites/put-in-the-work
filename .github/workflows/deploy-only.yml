name: Deploy Only to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  SERVICE: ${{ vars.SERVICE_NAME || 'putting-in-the-work' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  MEMORY: ${{ vars.CLOUD_RUN_MEMORY || '512Mi' }}
  CPU: ${{ vars.CLOUD_RUN_CPU || '1' }}
  MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '10' }}
  MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '0' }}
  PORT: ${{ vars.CLOUD_RUN_PORT || '8080' }}
  TIMEOUT: ${{ vars.CLOUD_RUN_TIMEOUT || '300' }}
  NODE_ENV: ${{ vars.NODE_ENV || 'production' }}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event.inputs.image_tag }}" = "latest" ]; then
            LATEST_TAG=$(gcloud artifacts docker images list \
              ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }} \
              --sort-by="~UPDATE_TIME" \
              --limit=1 \
              --format="value(TAG)" || echo "latest")
            echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
            echo "Using latest tag: ${LATEST_TAG}"
          else
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "Using specified tag: ${{ github.event.inputs.image_tag }}"
          fi

      - name: Verify image exists
        run: |
          IMAGE_URL="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.tag }}"
          echo "Verifying image exists: ${IMAGE_URL}"
          gcloud artifacts docker images describe "${IMAGE_URL}" || {
            echo "Error: Image ${IMAGE_URL} not found in Artifact Registry"
            echo "Available images:"
            gcloud artifacts docker images list \
              ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }} \
              --limit=10 \
              --format="table(TAG,UPDATE_TIME)"
            exit 1
          }

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.tag }}
          flags: |
            --allow-unauthenticated
            --memory=${{ env.MEMORY }}
            --cpu=${{ env.CPU }}
            --max-instances=${{ env.MAX_INSTANCES }}
            --min-instances=${{ env.MIN_INSTANCES }}
            --port=${{ env.PORT }}
            --timeout=${{ env.TIMEOUT }}
            --set-env-vars=NODE_ENV=${{ env.NODE_ENV }}

      - name: Show Output
        run: |
          echo "🚀 Deployment successful!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "Deployed image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ steps.image-tag.outputs.tag }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
