apiVersion: apps/v1
kind: Deployment
metadata:
  name: putting-in-the-work
  labels:
    app: putting-in-the-work
spec:
  replicas: 1
  selector:
    matchLabels:
      app: putting-in-the-work
  template:
    metadata:
      labels:
        app: putting-in-the-work
    spec:
      containers:
      - name: app
        image: gcr.io/PROJECT_ID/putting-in-the-work:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: putting-in-the-work-service
spec:
  selector:
    app: putting-in-the-work
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer