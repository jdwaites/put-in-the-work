apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: putting-in-the-work
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        # CPU is only allocated during request processing
        run.googleapis.com/cpu-throttling: "true"
        # Use the latest Cloud Run revision
        run.googleapis.com/execution-environment: gen2
        # Startup CPU boost
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Allow up to 1000 concurrent requests per instance
      containerConcurrency: 1000
      # Request timeout (maximum 3600 seconds for Cloud Run)
      timeoutSeconds: 300
      containers:
      - name: putting-in-the-work
        # Image will be set by the deployment pipeline
        image: gcr.io/PROJECT_ID/putting-in-the-work:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            # CPU allocation (1 = 1 vCPU)
            cpu: "1"
            # Memory allocation
            memory: 512Mi
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        # Health check probe
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness probe
        startupProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
      # Automatic scaling
      scaling:
        # Minimum number of instances
        minScale: 0
        # Maximum number of instances
        maxScale: 10
  traffic:
  - percent: 100
    latestRevision: true